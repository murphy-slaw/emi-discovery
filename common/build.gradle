plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven { url "https://maven.fabricmc.net/" }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven/"
    }
    maven { url "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation 'org.jetbrains:annotations:25.0.0'
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.3"))
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.3"))
    modApi("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    //modApi("com.terraformersmc:modmenu:${modmenu_version}")
    compileOnly "dev.emi:emi-xplat-mojmap:${emi_version}"
    /*
    modCompileOnly("dev.emi:emi-forge:${emi_version}") {
        exclude(group: "net.minecraftforge.fml")
    }
     */
    compileOnly "org.ow2.asm:asm:9.7.1"


    modImplementation("net.fabricmc:fabric-language-kotlin:1.13.9+kotlin.2.3.10")
    modCompileOnly "maven.modrinth:reliable-emi:${emixx_version}"
    compileOnly("fuzs.forgeconfigapiport:forgeconfigapiport-fabric:8.0.3")


}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
